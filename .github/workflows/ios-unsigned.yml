name: Build iPad app (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check Xcode
        run: xcodebuild -version
      - run: npm ci
      - name: Check source
        run: |
          npx tsc --noEmit
          npx expo lint
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install native dependencies
        working-directory: ios
        run: pod install
      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Package IPA for local signing
        shell: bash
        run: |
          set -euo pipefail
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          test -f "$app/main.jsbundle"
          mkdir -p package/Payload
          cp -R "$app" package/Payload/
          cd package
          zip -qry ../iPadLab-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iPadLab-unsigned
          path: iPadLab-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
